<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowPath ERD 최종</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap"><style>
/* 표는 열·행 격자에 고정 배치하고, 연결선은 표 사이 통로로만 지나가게 직각으로 그린다. 선은 FK 열에서 출발해 참조하는 PK 열의 화살표로 끝난다. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --card: #ffffff; --ink: #1d2330; --muted: #5f6b7d; --line-soft: #dde2ea; --head: #f4f6f9;
  --shadow: 0 1px 2px rgba(20,24,40,.08), 0 2px 8px rgba(20,24,40,.06);
  --pk: #a15c00; --pk-bg: #fff1d6; --fk: #1d4ed8; --fk-bg: #e3ebff; --hl: #fff4bf;
  --g-people: #2563eb; --g-diag: #b45309; --g-road: #0f766e; --g-res: #15803d; --g-crit: #dc2626; --g-reg: #7c3aed; --g-rag: #c026d3; --g-knowledge: #0e7490; --g-misc: #475569;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-code: "IBM Plex Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #191d25; --card: #20252f; --ink: #e7eaf0; --muted: #9aa3b2; --line-soft: #343b49; --head: #272d39;
    --shadow: 0 1px 3px rgba(0,0,0,.5); --pk: #f0b040; --pk-bg: #3a2e14; --fk: #8fb0ff; --fk-bg: #1f2a46; --hl: #3b3517;
    --g-people: #6f9bff; --g-diag: #f0b040; --g-road: #3fc4b0; --g-res: #5cc47a; --g-crit: #f87171; --g-reg: #ae8cff; --g-rag: #e879f9; --g-knowledge: #67e8f9; --g-misc: #9aa7bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #191d25; --card: #20252f; --ink: #e7eaf0; --muted: #9aa3b2; --line-soft: #343b49; --head: #272d39;
  --shadow: 0 1px 3px rgba(0,0,0,.5); --pk: #f0b040; --pk-bg: #3a2e14; --fk: #8fb0ff; --fk-bg: #1f2a46; --hl: #3b3517;
  --g-people: #6f9bff; --g-diag: #f0b040; --g-road: #3fc4b0; --g-res: #5cc47a; --g-crit: #f87171; --g-reg: #ae8cff; --g-rag: #e879f9; --g-knowledge: #67e8f9; --g-misc: #9aa7bb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { display: flex; flex-direction: column; min-width: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); }
.bar { flex: none; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line-soft);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; }
.bar h1 { font-size: 16px; margin: 0; }
.sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; background: var(--head); border: 1px solid var(--line-soft); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; }
.ctl button { border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer; }
.ctl button:hover { background: var(--head); }
.ctl label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
#search { width: 150px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--card); color: var(--ink); padding: 4px 8px; font: inherit; font-size: 12px; }
#zoom { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--fk); outline-offset: 2px; }
.legend { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }
.legend .k { font-family: var(--font-code); font-size: 10px; font-weight: 600; padding: 0 4px; border-radius: 3px; line-height: 16px; }
.k.pk { color: var(--pk); background: var(--pk-bg); } .k.fk { color: var(--fk); background: var(--fk-bg); }
#viewport { position: relative; flex: 1; min-height: 0; overflow: auto; cursor: grab; }
#viewport.panning { cursor: grabbing; user-select: none; }
#stage { position: relative; }
#canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.panel { position: absolute; z-index: 0; border: 1px solid color-mix(in srgb, var(--pc) 35%, var(--line-soft)); border-radius: 12px;
  background: color-mix(in srgb, var(--pc) 4%, var(--panel)); }
.panel .ptitle { position: absolute; left: 14px; top: 11px; font-size: 14px; font-weight: 700; color: var(--pc); white-space: nowrap; }
.panel .ptitle small { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
.card { position: absolute; z-index: 2; width: var(--cw); background: var(--card); border: 1px solid var(--line-soft); border-top: 3px solid var(--pc);
  border-radius: 8px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .12s; }
.card.ghost { border-style: dashed; border-top-style: dashed; box-shadow: none; background: color-mix(in srgb, var(--card) 70%, transparent); }
.card.pinned { outline: 2.5px solid var(--pc); outline-offset: 2px; }
.card.match { outline: 2.5px dashed var(--fk); outline-offset: 3px; }
.card.dim { opacity: .28; }
.ch { padding: 7px 10px 6px; border-bottom: 1px solid var(--line-soft); background: var(--head); border-radius: 6px 6px 0 0; }
.ch .t { display: flex; align-items: baseline; gap: 6px; }
.ch b { font-size: 13.5px; flex: 1; min-width: 0; }
.ch .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ch .cnt.zero { font-style: italic; }
.ch code { display: block; font-family: var(--font-code); font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
.ch .ext { font-size: 10.5px; color: var(--muted); }
.row { display: grid; grid-template-columns: 34px 1fr 14px 74px; align-items: center; gap: 4px; padding: 3px 8px; min-height: 24px;
  border-top: 1px solid var(--line-soft); font-size: 12px; }
.ch + .row { border-top: 0; }
.row .key { display: flex; gap: 2px; }
.row .key i { font-style: normal; font-family: var(--font-code); font-size: 8.5px; font-weight: 600; text-align: center; border-radius: 3px; line-height: 14px; padding: 0 2px; }
.row .key i.pk { color: var(--pk); background: var(--pk-bg); } .row .key i.fk { color: var(--fk); background: var(--fk-bg); }
.row .nm { font-family: var(--font-code); min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.row.pkr .nm { font-weight: 600; }
.row .nn { font-size: 8.5px; color: var(--muted); text-align: center; }
.row .ty { font-family: var(--font-code); font-size: 10px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.plain { display: none; } body.allcols .row.plain { display: grid; }
.row.more { display: block; text-align: center; color: var(--muted); font-size: 10.5px; min-height: 0; padding: 3px 8px; } body.allcols .row.more { display: none; }
.row.hl { background: var(--hl); }
.row:last-child { border-radius: 0 0 7px 7px; }
#links { position: absolute; left: 0; top: 0; z-index: 3; overflow: visible; pointer-events: none; }
.edge .vis { fill: none; stroke: var(--ec); stroke-width: 1.7; stroke-linejoin: round; transition: opacity .12s, stroke-width .12s; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
.edge .arw, .edge .dot { fill: var(--ec); transition: opacity .12s; }
.edge .dot { stroke: var(--card); stroke-width: 1.2; }
#links.focus .edge { opacity: .07; }
#links.focus .edge.on { opacity: 1; }
#links.focus .edge.on .vis { stroke-width: 3; }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 420px; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.5;
  padding: 6px 9px; border-radius: 6px; box-shadow: var(--shadow); }
#tip code { font-family: var(--font-code); font-size: 11.5px; }
#tip[hidden], #details[hidden] { display: none; }
#details { position: fixed; right: 12px; bottom: 12px; z-index: 15; width: min(460px, calc(100vw - 24px)); max-height: 55vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line-soft); border-top: 4px solid var(--pc, var(--fk)); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 14px 16px; font-size: 13px; }
#details h3 { margin: 0 32px 2px 0; font-size: 16px; }
#details h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); }
#details code { font-family: var(--font-code); font-size: 11.5px; }
#details ul { margin: 0; padding-left: 18px; } #details li { margin: 3px 0; overflow-wrap: anywhere; }
#details pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-code); font-size: 11px; background: var(--head); border-radius: 6px; padding: 8px; }
#details .close { position: absolute; right: 10px; top: 10px; border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
#details a { color: var(--fk); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
#details ol { margin: 0; padding-left: 22px; } #details ol li { margin: 4px 0; }
@media (prefers-reduced-motion: reduce) { .card, .edge .vis, .edge .arw { transition: none; } }
@media (max-width: 700px) { .legend { display: none; } #search { width: 120px; } }
.card .ch {cursor:move;touch-action:none;user-select:none}.card.dragging{z-index:8;box-shadow:0 8px 24px #0003}.card.dragging .ch{cursor:grabbing}#dragNotice{font-size:11px;color:var(--muted)}</style></head><body><header class="bar"><div><h1>GrowPath · ERD 최종</h1><div class="sub" id="summary"></div></div>
<nav class="tabs" aria-label="구조 선택"><button data-view="active">운영 구조</button><button data-view="meta">관리 구조</button><button data-view="archive">보관 구조</button></nav>
<div class="ctl"><input id="search" aria-label="테이블 검색" placeholder="테이블 검색 (Enter로 이동)"><label><input type="checkbox" id="all">모든 열</label>
<button id="minus" aria-label="축소">−</button><span id="zoom">100%</span><button id="plus" aria-label="확대">+</button><button id="actual">100%</button><button id="fit">전체 보기</button>
<button id="theme">다크/라이트</button><button id="layoutReset" title="현재 보기의 표 위치를 기본 격자로 복원">배치 초기화</button><button id="layoutExport">배치 내보내기</button><span id="dragNotice">표 제목을 드래그 · 배치 자동 저장</span><button id="reset">선택 해제</button><button id="list">테이블 목록</button></div>
<div class="legend"><span><svg width="64" height="12" aria-hidden="true"><circle cx="4" cy="6" r="3.2" fill="var(--muted)"/><path d="M4 6H54" stroke="var(--muted)" stroke-width="1.8"/><path d="M62 6l-9 -4.5v9z" fill="var(--muted)"/></svg>FK 열에서 출발해 참조하는 PK 열을 가리킵니다</span>
<span>선 색 = FK가 있는 표의 묶음 색</span><span><i class="k pk">PK</i>기본키 <i class="k fk">FK</i>외래키 NN 필수 값</span><span>표·선에 마우스를 올리면 그 연결만 강조 · 표를 누르면 고정 · 빈 곳 드래그로 이동 · Ctrl+휠 확대</span></div></header>
<main id="viewport"><div id="stage"><div id="canvas"><svg id="links" aria-hidden="true"></svg></div></div></main>
<aside id="details" hidden></aside><div id="tip" hidden></div><script>
const D=__DATA__;
const W=268,G=112,M=80,PX=14,PT=44,PB=16,RG=22,LS=9;
const canvas=document.querySelector('#canvas'),svg=document.querySelector('#links'),vp=document.querySelector('#viewport'),stage=document.querySelector('#stage'),detail=document.querySelector('#details'),tip=document.querySelector('#tip');
let view='active',scale=1,pinned=null,model=null,firstFit=true;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kind=k=>k.startsWith('growpath_legacy.')?'archive':k.startsWith('growpath_meta.')?'meta':'active';
const P=n=>'public.'+n,R=n=>'regulations.'+n,L=n=>'growpath_legacy.'+n,MT=n=>'growpath_meta.'+n,K=n=>'knowledge.'+n;
const GROUPS={diagnosis:['프로젝트·설문·진단','--g-diag'],people:['기관·부서·직원','--g-people'],criteria:['규정 평가기준·출처','--g-crit'],roadmap:['로드맵·성장 보고서·프롬프트','--g-road'],
  resources:['스킬·직무·학습 자료','--g-res'],knowledge:['회사 정보·생활안내 검색','--g-knowledge'],rag:['규정 벡터 검색·출처','--g-rag'],regulations:['규정 원문·버전·적용 범위','--g-reg'],archive:['보관 구조 · growpath_legacy','--g-misc'],meta:['관리 구조 · growpath_meta','--g-misc'],other:['기타','--g-misc']};
// 띠(band)마다 묶음을 나란히 두고, 묶음 안에서는 행 단위로 표를 맞춘다. 같은 행의 표끼리는 연결선이 곧게 이어진다.
const LAYOUT={
  active:[
    [{g:'diagnosis',cols:[0,1],rows:[[P('assessment_responses'),P('projects')],[P('assessment_questions'),P('diagnostic_rounds')],[null,P('employee_recommended_prompts')]]},
     {g:'people',cols:[2,3],rows:[[P('employees'),P('institutions')],[P('employee_skills'),P('departments')],[P('employee_certifications'),P('job_grades')],[P('employee_education_records'),P('employee_input_profiles')]]},
     {g:'criteria',cols:[4],rows:[[R('evaluation_result_schemas')],[R('evaluation_item_definitions')],[R('evaluation_schema_sources')]]}],
    [{g:'roadmap',cols:[0,1],rows:[[P('growth_reports'),P('roadmaps')],[P('roadmap_comments'),P('roadmap_steps')],[P('prompt_versions'),P('roadmap_step_resources')]]},
     {g:'resources',cols:[2,3,4],rows:[[P('certifications'),P('certification_skills'),P('skill_tags')],[P('books'),P('book_skills'),null],[P('courses'),P('course_skills'),null],[P('jobs'),P('job_skills'),null],[P('majors'),P('major_skills'),null],[null,P('learning_resource_embeddings'),null]]}],
    [{g:'knowledge',cols:[0],rows:[[K('documents')],[K('chunks')]]},
     {g:'rag',cols:[1],rows:[[R('rag_chunks')],[R('rag_chunk_sources')],[R('rag_chunk_embeddings')]]},
     {g:'regulations',cols:[2,3,4],rows:[[R('regulations'),R('regulation_files'),R('regulation_references')],[R('regulation_versions'),R('regulation_nodes'),R('regulation_scopes')]]}]],
  meta:[[{g:'meta',cols:[0,1],rows:[[MT('catalog_api_sources'),MT('schema_migrations')]]}]],
  archive:[[{g:'archive',cols:[0,1,2,3],rows:[[L('agent_selections'),L('agent_generations'),L('roadmap_requests'),L('finetuning_datasets')],[L('preference_pairs'),null,P('prompt_versions'),L('test_mock_profiles')]]}]]
};
const TYPE=t=>t.replace('character varying','varchar').replace('timestamp with time zone','timestamptz').replace('timestamp without time zone','timestamp').replace(/^integer$/,'int').replace(/^boolean$/,'bool');
const wbr=s=>esc(s).replace(/_/g,'_<wbr>');
const VIEW_NAME={active:'운영 구조',meta:'관리 구조',archive:'보관 구조'};

function cardEl(k,g,ghost){
  const s=D[k],fk=new Set(s.fks.flatMap(f=>f.columns)),showFull=k==='public.employee_recommended_prompts';
  const el=document.createElement('section');el.className='card'+(ghost?' ghost':'');el.dataset.table=k;el.tabIndex=0;
  el.style.setProperty('--pc','var('+GROUPS[g][1]+')');el.style.setProperty('--cw',W+'px');
  let hidden=0;
  const rows=s.columns.map(c=>{const pk=s.pk.includes(c.column),f=fk.has(c.column);if(!pk&&!f&&!showFull)hidden++;
    return '<div class="row'+(pk?' pkr':'')+(f?' fkr':'')+(pk||f||showFull?'':' plain')+'" data-col="'+esc(c.column)+'"><span class="key">'+(pk?'<i class="pk">PK</i>':'')+(f?'<i class="fk">FK</i>':'')+'</span><span class="nm">'+wbr(c.column)+'</span><span class="nn">'+(c.not_null?'NN':showFull?'NULL':'')+'</span><span class="ty" title="'+esc(c.type)+'">'+esc(TYPE(c.type))+'</span></div>'}).join('');
  el.innerHTML='<div class="ch"><div class="t"><b>'+esc(s.label)+'</b><span class="cnt'+(s.rows===0?' zero':'')+'">'+Number(s.rows).toLocaleString('ko-KR')+'행</span></div><code>'+wbr(k)+'</code>'+(ghost?'<span class="ext">'+VIEW_NAME[kind(k)]+'의 표 · 참조 위치만 표시</span>':'')+'</div>'+rows+(hidden&&!ghost?'<div class="row more">그 밖의 열 '+hidden+'개</div>':'');
  if(ghost)el.querySelectorAll('.row.plain').forEach(r=>r.remove());
  return el;
}

// 같은 대상을 가리키는 FK 중 열 집합이 다른 FK의 일부이면 하나의 선으로 합친다(예: roadmap_id 와 roadmap_id+project_id).
function edgesFor(keys,ghosts){
  const out=[];
  for(const k of keys){if(ghosts.has(k))continue;const fks=D[k].fks.filter(f=>keys.has(f.target));
    const used=new Set();
    for(const f of [...fks].sort((a,b)=>a.columns.length-b.columns.length)){if(used.has(f))continue;
      const group=fks.filter(h=>!used.has(h)&&h.target===f.target&&f.columns.every(c=>h.columns.includes(c)));group.forEach(h=>used.add(h));
      out.push({from:k,to:f.target,fc:f.columns[0],tc:f.target_columns[0],fks:group});}}
  return out;
}

function build(){
  canvas.querySelectorAll('.panel,.card').forEach(e=>e.remove());svg.replaceChildren();
  const inView=Object.keys(D).filter(k=>kind(k)===view);
  let bands=LAYOUT[view].map(b=>b.map(p=>({...p,rows:p.rows.map(r=>r.map(k=>k&&D[k]?k:null))})));
  const placed=new Set(bands.flat().flatMap(p=>p.rows.flat()).filter(Boolean));
  const missing=inView.filter(k=>!placed.has(k));
  if(missing.length){const nc=Math.min(4,missing.length),rows=[];for(let i=0;i<missing.length;i+=nc)rows.push(Array.from({length:nc},(_,j)=>missing[i+j]||null));bands.push([{g:'other',cols:[...Array(nc).keys()],rows}])}
  const NC=Math.max(...bands.flat().flatMap(p=>p.cols))+1;
  const ghosts=new Set([...placed].filter(k=>kind(k)!==view));
  const cards={},pos={},panels=[];
  bands.forEach((band,b)=>band.forEach(p=>{
    const pe=document.createElement('section');pe.className='panel';pe.style.setProperty('--pc','var('+GROUPS[p.g][1]+')');
    const n=p.rows.flat().filter(k=>k&&!ghosts.has(k)).length;
    pe.innerHTML='<div class="ptitle">'+esc(GROUPS[p.g][0])+'<small>'+n+'개 표</small></div>';canvas.appendChild(pe);panels.push({el:pe,p,b});
    p.rows.forEach((r,ri)=>r.forEach((k,ci)=>{if(!k)return;const el=cardEl(k,p.g,ghosts.has(k));canvas.appendChild(el);cards[k]=el;pos[k]={b,c:p.cols[ci],ri,p}}))}));
  // 높이 측정 → 행·띠 높이
  const H=k=>cards[k].offsetHeight;
  const bandH=bands.map(()=>0);
  for(const pp of panels){const rowsH=pp.p.rows.map(r=>Math.max(0,...r.filter(Boolean).map(H)));let y=0;pp.rowY=rowsH.map(h=>{const t=y;y+=h+RG;return t});pp.h=y-RG;bandH[pp.b]=Math.max(bandH[pp.b],pp.h);
    pp.p.rows.forEach((r,ri)=>r.forEach(k=>{if(k)pos[k].ry=pp.rowY[ri]}))}
  const off=(k,col)=>{const r=cards[k].querySelector('.row[data-col="'+CSS.escape(col)+'"]');return r&&r.offsetParent?r.offsetTop+r.offsetHeight/2:22};
  const colX=c=>M+c*(W+G),TW=2*M+NC*W+(NC-1)*G;
  const gx0=g=>g===0?0:colX(g-1)+W,gx1=g=>g===NC?TW:colX(g);
  const laneRange=g=>[g===0?12:gx0(g)+PX+8,g===NC?TW-12:gx1(g)-PX-8];

   if(cancel){p.x=t.px;p.y=t.py;p.moved=t.wasMoved;Object.assign(cards[k].style,{left:p.x+'px',top:p.y+'px'});if(t.moved){p.moved=true;updateDraggedGeometry();p.moved=t.wasMoved}}

  head.addEventListener('pointerup',ev=>finish(ev,false));head.addEventListener('pointercancel',ev=>finish(ev,true));

}
