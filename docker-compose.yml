# GrowPath 통합 개발 환경 · docker compose
#
#   docker compose up -d --build        복원된 BGE DB 검사 → BGE 서버·백엔드 → 화면(nginx)까지 모두 켬
#   docker compose up -d backend        화면은 로컬에서 개발할 때(frontend 폴더에서 npm run dev): DB·백엔드만 켬
#   docker compose down                 끄기 (데이터는 볼륨에 남음) · down -v 는 DB까지 지움
#
# 값은 같은 폴더의 .env 에서 읽는다(.env.example 참고). 비밀번호·키를 이 파일에 쓰지 않는다.
# 같은 PC의 다른 환경과 겹치지 않게 이름(=볼륨 이름 앞부분)·포트는 .env 로 바꾼다.
name: ${COMPOSE_PROJECT_NAME:-growpath}

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    # 컨테이너 안에서는 db 서비스 이름으로 붙는다(.env 의 DATABASE_URL·GP5_DB_PORT 는 로컬 파이썬 실행용)
    DATABASE_URL: postgresql+psycopg://${GP5_DB_USER:-growpath}:${GP5_DB_PASSWORD:?.env 에 GP5_DB_PASSWORD 를 넣어 주세요}@db:5432/${GP5_APP_DB_NAME:-growpath_bge_m3}
    # 규정 원문 PDF(팀 규정 묶음의 source/ · team_db/README.md) — 관리자 '지금 규정' 내려받기
    GP5_REGULATION_FILES_DIR: /srv/growpath/regulation_files
    # 모든 검색은 #124 공유 BGE DB와 같은 1024차원 모델을 사용한다. 생성 LLM은 별도다.
    ASSISTANT_SEARCH_MODE: ${ASSISTANT_SEARCH_MODE:-hybrid}
    BGE_M3_BASE_URL: ${BGE_M3_BASE_URL:-http://bge-m3:8080/v1}

services:
  # #124와 동일한 공식 revision·CLS·L2의 CPU 질문 임베딩 서버.
  bge-m3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "uvicorn", "tools.serve_bge_m3:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      BGE_M3_MODEL_DIR: /models
      BGE_M3_THREADS: ${BGE_M3_THREADS:-4}
      BGE_M3_DTYPE: ${BGE_M3_DTYPE:-float32}
    volumes:
      - type: bind
        source: ${BGE_M3_MODEL_DIR:-./.cache/bge-m3-official-5617a9f}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 20
    restart: unless-stopped

  # PostgreSQL 17 + pgvector — 팀 DB(PostgreSQL 17.11 + pgvector 0.8.x)와 버전을 맞춤
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${GP5_APP_DB_NAME:-growpath_bge_m3}
      POSTGRES_USER: ${GP5_DB_USER:-growpath}
      POSTGRES_PASSWORD: ${GP5_DB_PASSWORD:?.env 에 GP5_DB_PASSWORD 를 넣어 주세요}
    ports:
      - "127.0.0.1:${GP5_DB_PORT:-55465}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  # 복원된 공유 BGE DB를 읽기 전용으로 검사한다.
  backend-setup:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "tools/verify_bge_database.py"]
    restart: "no"

  # 참고용 백엔드(5차 FastAPI 그대로). 팀원 백엔드가 준비되면 이 서비스만 바꾸면 된다
  backend:
    <<: *backend
    depends_on:
      backend-setup:
        condition: service_completed_successfully
      bge-m3:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8815}:8785"
    volumes:
      # 관리자가 올린 규정 PDF 는 var/uploads/regulations/ 에 남는다(시스템 관리자가 docker compose cp 로 꺼냄)
      - uploads:/srv/growpath/var
      - ./team_db/regulations:/srv/growpath/regulation_files:ro
      - ./backend/models:/srv/growpath/models:ro

  # 화면: React 빌드 결과를 nginx 가 제공하고 /api 는 backend 로 넘긴다(같은 주소라 로그인 쿠키가 그대로 동작)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEMO_TOOLS: ${VITE_DEMO_TOOLS:-off}
    depends_on:
      - backend
    environment:
      API_UPSTREAM: http://backend:8785
    ports:
      - "127.0.0.1:${WEB_PORT:-8816}:80"

volumes:
  pgdata:
  uploads:
